name: CI Pipeline

on:
  push:
    branches: [ master, main, 'chore/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore SistemaVisionTech/SistemaVisionTech.csproj

    - name: Build Backend (Release)
      run: dotnet build SistemaVisionTech/SistemaVisionTech.csproj --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test SistemaVisionTech.Tests/SistemaVisionTech.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend Build (Angular 19)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Build Frontend (Production)
      working-directory: frontend
      run: npm run build
